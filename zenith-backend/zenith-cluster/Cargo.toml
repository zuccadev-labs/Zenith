[package]
name = "zenith-cluster"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
zeromq = "0.7"
tokio = { version = "1.54", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
once_cell = "1.21"
async-trait = "0.1.92"
