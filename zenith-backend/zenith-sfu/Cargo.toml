[package]
name = "zenith-sfu"
version = "1.0.0"
edition = "2021"
description = "High-performance WebRTC SFU Data Plane via FFI"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Async runtime
tokio = { version = "1.32", features = ["full"] }

# WebRTC Implementation
webrtc = "0.10"

# Error handling and logging
tracing = "0.1"
tracing-subscriber = "0.3"
