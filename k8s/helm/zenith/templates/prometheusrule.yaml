{{- if .Values.prometheusRule.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "zenith.fullname" . }}
  namespace: {{ .Values.prometheusRule.namespace | default .Release.Namespace }}
  labels:
    {{- include "zenith.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- /* The canonical rules (files/zenith-alerts.yaml, a copy of observability/prometheus/zenith-alerts.yaml
         that the CI keeps identical) plus any extra groups from values. */}}
  {{- $groups := list }}
  {{- if .Values.prometheusRule.includeDefaultRules }}
  {{- $groups = (.Files.Get "files/zenith-alerts.yaml" | fromYaml).groups }}
  {{- end }}
  groups:
    {{- toYaml (concat $groups (.Values.prometheusRule.groups | default list)) | nindent 4 }}
{{- end }}
