apiVersion: v1
kind: Service
metadata:
  name: {{ include "zenith.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zenith.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort | default 9090 }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "zenith.selectorLabels" . | nindent 4 }}
