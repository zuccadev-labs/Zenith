{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zenith.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zenith.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.zenith.masterKey }}
  MASTER_KEY: {{ .Values.zenith.masterKey | quote }}
  {{- end }}
  {{- if .Values.zenith.jwtSecret }}
  JWT_SECRET: {{ .Values.zenith.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.zenith.database.surreal.password }}
  SURREAL_PASS: {{ .Values.zenith.database.surreal.password | quote }}
  {{- end }}
  {{- if .Values.zenith.qdrant.apiKey }}
  QDRANT_API_KEY: {{ .Values.zenith.qdrant.apiKey | quote }}
  {{- end }}
  {{- with .Values.secret.extraKeys }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
