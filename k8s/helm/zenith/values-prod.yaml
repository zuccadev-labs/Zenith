# ============================================================================
# Zenith Helm Chart — values-prod.yaml
# Production-grade overrides for Fortune 500 deployment.
# ============================================================================

replicaCount: 6

image:
  registry: ghcr.io
  repository: zuccadev-labs/zenith-backend
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

imagePullSecrets:
  - name: ghcr-pull-secret

# ── Service ──────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 8080
  grpcPort: 50051
  metricsPort: 9090
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"

# ── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "EECDH+AESGCM:EDH+AESGCM"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/hostname: "api.zenith.io"
  hosts:
    - host: api.zenith.io
      tlsSecretName: zenith-tls
      paths:
        - path: /
          pathType: Prefix

# ── Resources (prod: tuned for c6i.2xlarge nodes) ────────────────────────────
resources:
  requests:
    cpu: "1000m"
    memory: "1Gi"
  limits:
    cpu: "4000m"
    memory: "4Gi"

# ── HPA ──────────────────────────────────────────────────────────────────────
autoscaling:
  enabled: true
  minReplicas: 6
  maxReplicas: 100
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  # Whole autoscaling/v2 MetricSpecs. Requests per second per pod, from http_requests_total through the
  # Prometheus Adapter (rule: sum(rate(http_requests_total[2m])) by (pod), exposed as
  # http_requests_per_second). Before, these entries lacked the pods/object block and the metric name, and the
  # HPA did not validate; the Ingress-wide one was dropped: it lacked its target value and per pod covers it.
  extraMetrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "10"

# ── PDB ──────────────────────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 3

# ── Strategy ─────────────────────────────────────────────────────────────────
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 3
    maxUnavailable: 0

# ── Topology spread (multi-AZ) ───────────────────────────────────────────────
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: zenith
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: zenith

# ── Affinity (anti-affinity) ─────────────────────────────────────────────────
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: ["zenith"]
        topologyKey: kubernetes.io/hostname

# ── Network Policy (microsegmentation) ───────────────────────────────────────
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring
  egress:
    mongodb:
      hosts:
        - labels:
            app: mongodb
            port: 27017
    vault:
      namespace: vault
      port: 8200
    mqtt:
      labels:
        app: emqx
      port: 1883

# ── Zenith App Config ────────────────────────────────────────────────────────
zenith:
  appId: "zenith-prod"
  port: 8080
  features:
    iot:         true
    vectordb:    true
    agents:      true
    timeseries:  true
    workflow:    true
    multiTenant: true
    compliance:  true
    saas:        true
    ecommerce:   true
  database:
    surreal:
      url: "http://mongodb.zenith-prod.svc.cluster.local:27017"
      namespace: "zenith"
      database: "production"
  qdrant:
    url: "http://qdrant.zenith-prod.svc.cluster.local:6333"
  mqtt:
    url: "mqtt://emqx.zenith-prod.svc.cluster.local:1883"
    namespace: "zenith"
  scylla:
    hosts: ["scylla.zenith-prod.svc.cluster.local:9042"]
    keyspace: zenith
    ttlDays: 90
  ollama:
    url: "http://ollama.zenith-prod.svc.cluster.local:11434"
    embedModel: "nomic-embed-text"
    agentModel: "llama3.1"

# ── Secret management (Vault Agent injection) ────────────────────────────────
vault:
  enabled: true
  role: zenith-prod

# ── Env vars ─────────────────────────────────────────────────────────────────
env:
  - name: DENO_ENV
    value: production
  - name: LOG_LEVEL
    value: info
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://otel-collector.monitoring.svc.cluster.local:4317
  - name: OTEL_SERVICE_NAME
    value: zenith-backend
  - name: PROMETHEUS_REMOTE_WRITE_URL
    value: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write
  - name: LOKI_PUSH_URL
    value: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

# ── Service Monitor ──────────────────────────────────────────────────────────
serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  labels:
    release: prometheus

# ── PrometheusRule (alerts) ──────────────────────────────────────────────────
prometheusRule:
  enabled: true
  namespace: monitoring
  labels:
    release: prometheus
  # The rules are the canonical ones (observability/prometheus/zenith-alerts.yaml, included by
  # includeDefaultRules). The copies that lived here were duplicates, with labels the code does not emit.
  includeDefaultRules: true
  groups: []

# ── Service Account ──────────────────────────────────────────────────────────
serviceAccount:
  create: true
  automount: true
  name: "zenith"
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/ZenithProdRole"
    iam.amazonaws.com/role: "ZenithProdRole"

# ── Termination grace (for in-flight requests) ───────────────────────────────
terminationGracePeriodSeconds: 90

# ── Revision history (rollback depth) ────────────────────────────────────────
revisionHistoryLimit: 20

# ── Secret (DO NOT commit real values; use external secrets operator) ────────
secret:
  create: false
  extraKeys: {}

# ── Probes ───────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30
  successThreshold: 1

# ── Security Context ─────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
  sysctls:
    - name: net.core.somaxconn
      value: "65535"

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL
