# ============================================================================
# Zenith Helm Chart — values.yaml
# Valores por defecto (override con values.prod.yaml en producción)
# ============================================================================

replicaCount: 2

image:
  repository: ghcr.io/zuccadev-labs/zenith-backend
  pullPolicy: IfNotPresent
  # Empty: the chart's appVersion (never "latest", which is mutable).
  tag: ""
  # sha256:… of the signed image: pins exactly what was built and verified (docs/development/05-cadena-de-suministro.md).
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "zenith"

# ── Service Account ──────────────────────────────────────────────────────────
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "zenith"

# ── Service ──────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 1337
  grpcPort: 50051

# ── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.zenith.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # tls:
  #   - secretName: zenith-tls
  #     hosts:
  #       - api.zenith.example.com

# ── Resources ────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "2000m"
    memory: "1Gi"

# ── Horizontal Pod Autoscaler ────────────────────────────────────────────────
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 50
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
    scaleUp: { stabilizationWindowSeconds: 30 }
  # Escala IoT workers por mensajes MQTT (custom metrics via KEDA si disponible)

# ── Pod Disruption Budget (alta disponibilidad) ──────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ── Zenith App Configuration ─────────────────────────────────────────────────
zenith:
  appId: "zenith-production"
  port: 1337
  # masterKey: se inyecta desde secret (ver secretRef)
  # jwtSecret: se inyecta desde secret

  # Feature flags — activar según necesidad
  features:
    iot:         true
    vectordb:    true
    agents:      true
    timeseries:  true
    workflow:    true
    multiTenant: false
    compliance:  false
    saas:        false
    ecommerce:   false

  # Database
  database:
    # URI inyectada desde secret
    surreal:
      url: "http://surrealdb:8000"
      namespace: "zenith"
      database: "production"

  # Vector DB
  qdrant:
    url: "http://qdrant:6333"

  # MQTT
  mqtt:
    url: "mqtt://emqx:1883"
    namespace: "zenith"

  # TimeSeries (ScyllaDB)
  scylla:
    hosts: ["scylla:9042"]
    keyspace: "zenith"
    ttlDays: 90

  # Ollama
  ollama:
    url: "http://ollama:11434"
    embedModel: "nomic-embed-text"
    agentModel: "llama3.1"

# ── Environment Variables ────────────────────────────────────────────────────
env:
  - name: DENO_ENV
    value: production
  - name: LOG_LEVEL
    value: info

# ── Secret References (Kubernetes Secrets) ───────────────────────────────────
# Crea el secret con:
#   kubectl create secret generic zenith-secrets \
#     --from-literal=MASTER_KEY=<key> \
#     --from-literal=JWT_SECRET=<secret> \
#     --from-literal=SURREAL_PASS=<pass> \
#     --from-literal=QDRANT_API_KEY=<key> \
#     --from-literal=FILE_SIGNING_KEY=$(openssl rand -hex 32) \
#     --from-literal=AUDIT_SIGNING_KEY=$(openssl rand -hex 32) \
#     --from-literal=WEBHOOK_SECRETS_KEY=$(openssl rand -hex 32)
# WEBHOOK_SECRETS_KEY cifra los secretos de los webhooks en la base (ADR-017): igual en todas las réplicas.
# FILE_SIGNING_KEY y AUDIT_SIGNING_KEY (HMAC, ADR-016) deben ser iguales en todas las réplicas: sin ellas
# cada réplica usa una clave aleatoria propia y no reconoce lo que firman las demás.
envFrom:
  - secretRef:
      name: zenith-secrets

# ── Health Checks ─────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 5

# ── Pod Security ──────────────────────────────────────────────────────────────
# The image's user is 10001:10001 (Dockerfile); before, 1000 here could not write /data, owned by 10001.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# /data: an emptyDir by default (state that matters lives in MongoDB/S3); a PVC to keep it across restarts.
persistence:
  existingClaim: ""
  emptyDirSizeLimit: 1Gi

# ── Affinity / Topology ───────────────────────────────────────────────────────
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["zenith"]
          topologyKey: kubernetes.io/hostname

# ── Node Selector ─────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []

# ── Volumes (para certificados mTLS y archivos de config) ────────────────────
volumes: []
volumeMounts: []

# ── ServiceMonitor (Prometheus Operator) ─────────────────────────────────────
serviceMonitor:
  enabled: false
  namespace: monitoring
  interval: 30s
  path: /metrics

# ── Secret del chart ─────────────────────────────────────────────────────────
# Por defecto los secretos vienen de `zenith-secrets` (envFrom, arriba), creado fuera del chart. Con
# create: true el chart crea el suyo a partir de zenith.masterKey, etc., más extraKeys. Antes faltaba esta
# clave y el chart no se podía renderizar sin values-prod.yaml.
secret:
  create: false
  extraKeys: {}

# ── PrometheusRule (alertas automáticas) ─────────────────────────────────────
prometheusRule:
  enabled: false
  # The canonical rules of observability/prometheus/zenith-alerts.yaml (files/zenith-alerts.yaml).
  includeDefaultRules: true
  # Extra groups, appended to the canonical ones. Empty: the ones that lived here (error rate, circuit
  # breaker, DLQ) are now in the canonical file, with the labels the code really emits.
  groups: []

# ── Claves que las plantillas leen y que faltaban aquí ───────────────────────
# Sin ellas, `helm template`/`helm install` fallaban con los valores por defecto ("nil pointer"); solo
# funcionaba con values-prod.yaml. Los valores son los que las plantillas ya asumían con `default`.
revisionHistoryLimit: 10
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: "25%"
    maxUnavailable: 0
terminationGracePeriodSeconds: 60
topologySpreadConstraints: []
extraConfig: []
networkPolicy:
  enabled: false
  # Egress when enabled: DNS and HTTPS to the internet are always allowed. Declare the databases:
  #   mongodb.hosts: [{ labels: { app: mongodb }, namespace: databases, port: 27017 }] or [{ cidr: 10.0.20.0/24 }]
  #   extra: raw NetworkPolicy egress rules (ScyllaDB, Redis, engine-auth…)
  egress: {}
vault:
  enabled: false
