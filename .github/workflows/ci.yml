# Zenith CI: the same gates that pass locally, so a red CI means a real regression.
#
# - engine:      format, lint, typecheck and unit tests of zenith-backend with deno.lock frozen; JSR dry-run.
# - integration: integration tests against MongoDB 9.0.4 (standalone, and a one-node replica set for
#                change streams), SurrealDB 4 and Vault 2 (TLS). The ones that also need engine-auth
#                (boot, pieces-e2e) need its binary and are run locally: see docs/development/02-pruebas.md.
# - cli:         typecheck and tests of zenith-cli with its lock frozen; JSR dry-run.
# - sdk:         clean install (npm ci) and typecheck of @zuccadev-labs/zenith-client.
# - image:       Docker build, Trivy scan (CRITICAL/HIGH with a fix available fail the build) and SBOM.
# - chart:       Helm lint/render, kubeconform, promtool on the alert rules, and the rules copy in sync.
# - security:    gitleaks (whole history), Semgrep OSS, zizmor + actionlint, hadolint, Trivy config, Checkov and
#                OSV-Scanner: open-source stand-ins for what GitHub sells for private repositories.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DENO_VERSION: "2.9.8"
  NODE_VERSION: "26"

jobs:
  engine:
    name: engine (lint, typecheck, unit tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zenith-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Format
        run: deno fmt --check src/ tests/
      - name: Lint
        run: deno lint src/
      - name: Typecheck
        run: deno check --frozen src/mod.ts
      - name: Dependency vulnerabilities (deno audit; OSV-Scanner cannot read deno.lock)
        run: deno audit --lock=deno.lock
      - name: Unit tests
        run: deno test --allow-all --no-check --unstable-kv --frozen tests/unit/
      - name: JSR package (dry run)
        run: deno publish --dry-run --allow-dirty

  integration:
    name: integration (MongoDB, SurrealDB, Vault)
    runs-on: ubuntu-24.04
    needs: engine
    defaults:
      run:
        working-directory: zenith-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Start MongoDB (standalone and replica set)
        working-directory: .
        run: |
          docker run -d --name mongo -p 127.0.0.1:27999:27017 mongo:9.0.8
          docker run -d --name mongors -p 127.0.0.1:28000:27017 mongo:9.0.8 --replSet rs0 --bind_ip_all
          for c in mongo mongors; do
            until docker exec $c mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1; do sleep 1; done
          done
          docker exec mongors mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          until docker exec mongors mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 1; done
      - name: Start SurrealDB and Vault (TLS)
        working-directory: .
        run: |
          docker run -d --name surreal -p 127.0.0.1:28800:8000 surrealdb/surrealdb:v4.0.1 start --user root --pass root memory
          docker run -d --name vault -p 127.0.0.1:28200:8200 --cap-add IPC_LOCK -e VAULT_DEV_ROOT_TOKEN_ID=root \
            hashicorp/vault:2.2.2 server -dev -dev-tls -dev-listen-address=0.0.0.0:8200 -dev-tls-san=127.0.0.1
          until curl -sf http://127.0.0.1:28800/health; do sleep 1; done
          until docker exec vault sh -c 'ls /tmp/vault-tls*/vault-ca.pem' >/dev/null 2>&1; do sleep 1; done
          docker exec vault sh -c 'cat /tmp/vault-tls*/vault-ca.pem' > "$RUNNER_TEMP/vault-ca.pem"
          until curl -sf --cacert "$RUNNER_TEMP/vault-ca.pem" https://127.0.0.1:28200/v1/sys/health; do sleep 1; done
      - name: Integration tests
        env:
          ZENITH_TEST_MONGO: mongodb://127.0.0.1:27999
          ZENITH_TEST_MONGO_URI: mongodb://127.0.0.1:27999/?directConnection=true
          MONGO_TEST_URI: mongodb://127.0.0.1:28000/?replicaSet=rs0&directConnection=true
          ZENITH_TEST_SURREAL_URL: http://127.0.0.1:28800
          VAULT_TEST_ADDR: https://127.0.0.1:28200
          VAULT_TEST_TOKEN: root
          ZENITH_STRESS: "1"
          ZENITH_STRESS_MONGO_CONTAINER: mongors
        run: |
          export DENO_CERT="$RUNNER_TEMP/vault-ca.pem"
          deno test --allow-all --no-check --unstable-kv --frozen \
            tests/integration/ tests/unit/mongodb-store.test.ts tests/unit/vault-client.test.ts

  # End to end with the real engine-auth: it builds engine-auth and libzutool_auth from devzucca/zutool
  # (private, another account). Enabled with the repository variable ZUTOOL_E2E=true and the secret
  # ZUTOOL_DEPLOY_KEY: a read-only deploy key of devzucca/zutool (only that repository, cannot write).
  e2e-engine-auth:
    name: e2e (engine-auth, MongoDB)
    runs-on: ubuntu-24.04
    needs: engine
    if: vars.ZUTOOL_E2E == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: devzucca/zutool
          ssh-key: ${{ secrets.ZUTOOL_DEPLOY_KEY }}
          path: zutool
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: zutool
      - name: Build engine-auth and libzutool_auth
        working-directory: zutool
        run: cargo build -p engine-auth -p zutool-auth
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Start MongoDB
        run: |
          docker run -d --name mongo -p 127.0.0.1:27999:27017 mongo:9.0.8
          until docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1; do sleep 1; done
      - name: End-to-end tests
        working-directory: zenith-backend
        env:
          ZENITH_TEST_MONGO: mongodb://127.0.0.1:27999
          ENGINE_AUTH_BIN: ${{ github.workspace }}/zutool/target/debug/engine-auth
          ZUTOOL_LIB_DIR: ${{ github.workspace }}/zutool/target/debug
        run: |
          deno test --allow-all --no-check --unstable-kv --frozen tests/integration/engine-auth.test.ts \
            tests/integration/boot.test.ts tests/integration/classes.test.ts tests/integration/pieces-e2e.test.ts

  cli:
    name: cli
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zenith-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Format
        run: deno fmt --check
      - name: Typecheck
        run: deno check --frozen zen.ts mod.ts
      - name: Dependency vulnerabilities (deno audit)
        run: deno audit --lock=deno.lock
      - name: Start MongoDB (zen init + zen dev end to end)
        run: |
          docker run -d --name mongo -p 127.0.0.1:27999:27017 mongo:9.0.8
          until docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1; do sleep 1; done
      - name: Tests
        env:
          ZENITH_TEST_MONGO: mongodb://127.0.0.1:27999
        run: deno test --allow-all --no-check --unstable-kv --frozen
      - name: JSR package (dry run)
        run: deno publish --dry-run --allow-dirty

  sdk:
    name: client SDK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/Typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sdk/Typescript/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npx tsc --noEmit -p .

  image:
    name: Docker image and Trivy scan
    runs-on: ubuntu-24.04
    needs: engine
    permissions:
      contents: read
      id-token: write # keyless Sigstore signature and GitHub attestations (the workflow's OIDC identity)
      attestations: write
    env:
      # Optional: with this secret the SBOM and the image ID are signed (docs/development/05-cadena-de-suministro.md).
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      # Optional: the registry the image is published to from main (repository variable).
      REGISTRY: ${{ vars.ZENITH_REGISTRY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t zenith-backend:${{ github.sha }} zenith-backend/
      - name: Trivy (CRITICAL/HIGH with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: zenith-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: SBOM (CycloneDX) of the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: zenith-backend:${{ github.sha }}
          format: cyclonedx-json
          output-file: zenith-backend.cdx.json
          upload-artifact: false
      - name: Image ID (what the signature covers)
        run: docker image inspect zenith-backend:${{ github.sha }} --format '{{.Id}}' > zenith-backend.image-id
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.COSIGN_PRIVATE_KEY != ''
        with:
          cosign-release: v3.1.4
      - name: Sign SBOM and image ID, attest SLSA provenance (cosign, own key, no public transparency log)
        if: env.COSIGN_PRIVATE_KEY != ''
        run: |
          # Own key, no public log: verifiable offline with zenith-backend/cosign.pub. The keyless signature follows.
          printf '%s' "$COSIGN_PRIVATE_KEY" > "$RUNNER_TEMP/cosign.key"
          for f in zenith-backend.cdx.json zenith-backend.image-id; do
            cosign sign-blob --yes --key "$RUNNER_TEMP/cosign.key" --use-signing-config=false --tlog-upload=false \
              --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --key zenith-backend/cosign.pub --insecure-ignore-tlog=true --bundle "$f.sigstore.json" "$f"
          done
          # SLSA v1 build provenance signed with our key (GitHub's own attestation is added below, after the push).
          tools/supply-chain/slsa-provenance.sh zenith-backend/Dockerfile > zenith-backend.provenance.json
          cosign attest-blob --yes --key "$RUNNER_TEMP/cosign.key" --type slsaprovenance1 \
            --predicate zenith-backend.provenance.json --use-signing-config=false --tlog-upload=false \
            --bundle zenith-backend.image-id.provenance.sigstore.json zenith-backend.image-id
          cosign verify-blob-attestation --key zenith-backend/cosign.pub --insecure-ignore-tlog=true \
            --type slsaprovenance1 --bundle zenith-backend.image-id.provenance.sigstore.json zenith-backend.image-id
      # Our own registry (Zot, open source; docs/development/06-registro-de-imagenes.md): the image is pushed from main, and its
      # signature, SLSA provenance and SBOM are attached to its digest (OCI referrers).
      - name: Publish, sign and attest the image in the registry
        id: publish
        if: env.COSIGN_PRIVATE_KEY != '' && env.REGISTRY != '' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_USER: ${{ secrets.ZENITH_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.ZENITH_REGISTRY_PASSWORD }}
          SHA: ${{ github.sha }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          repo="$REGISTRY/zenith/zenith-backend"
          docker tag "zenith-backend:$SHA" "$repo:$SHA"
          docker push "$repo:$SHA"
          img="$repo@$(docker inspect --format '{{index .RepoDigests 0}}' "$repo:$SHA" | sed 's/.*@//')"
          key="$RUNNER_TEMP/cosign.key"; pub=zenith-backend/cosign.pub
          cosign sign --yes --key "$key" --tlog-upload=false --use-signing-config=false "$img"
          cosign attest --yes --key "$key" --type slsaprovenance1 --predicate zenith-backend.provenance.json \
            --tlog-upload=false --use-signing-config=false "$img"
          cosign attest --yes --key "$key" --type cyclonedx --predicate zenith-backend.cdx.json \
            --tlog-upload=false --use-signing-config=false "$img"
          cosign verify --key "$pub" --insecure-ignore-tlog=true "$img" > /dev/null
          cosign verify-attestation --key "$pub" --insecure-ignore-tlog=true --type slsaprovenance1 "$img" > /dev/null
          # Second, keyless signature (the repository is public): Fulcio certificate for this workflow's OIDC
          # identity, recorded in Sigstore's public transparency log (Rekor). Anyone can verify it without our key.
          cosign sign --yes "$img"
          cosign verify "$img" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "$img" | tee zenith-backend.image-ref
          { echo "name=$repo"; echo "digest=${img##*@}"; } >> "$GITHUB_OUTPUT"
          docker logout "$REGISTRY"
      # GitHub artifact attestations (free on public repositories): SLSA build provenance and the CycloneDX SBOM,
      # bound to the image digest; `gh attestation verify oci://<image> -R zuccadev-labs/Zenith` checks them.
      - name: GitHub attestation, build provenance
        if: steps.publish.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
      - name: GitHub attestation, SBOM
        if: steps.publish.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: zenith-backend.cdx.json
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cosign.key"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-zenith-backend-${{ github.sha }}
          path: |
            zenith-backend.cdx.json
            zenith-backend.image-id
            zenith-backend.provenance.json
            zenith-backend.image-ref
            *.sigstore.json
          if-no-files-found: error

  # The Helm chart renders with its default and production values, its manifests are valid Kubernetes, the
  # alert rules are valid PromQL (canonical file and rendered PrometheusRule), and the chart's copy of the
  # canonical rules has not drifted.
  chart:
    name: Helm chart and alert rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The chart's copy of the alert rules is the canonical file
        run: cmp observability/prometheus/zenith-alerts.yaml k8s/helm/zenith/files/zenith-alerts.yaml
      - name: Lint and render (default and production values)
        run: |
          mkdir -p "$RUNNER_TEMP/chart"
          helm() { docker run --rm -u "$(id -u)" -v "$PWD/k8s/helm:/c:ro" -w /c alpine/helm:4.3.2 "$@"; }
          for v in values values-prod; do
            helm lint zenith -f "zenith/$v.yaml"
            helm template zenith zenith -n zenith -f "zenith/$v.yaml" --set prometheusRule.enabled=true \
              --set serviceMonitor.enabled=true --set networkPolicy.enabled=true \
              > "$RUNNER_TEMP/chart/$v.yaml"
            yq 'select(.kind == "PrometheusRule") | .spec' "$RUNNER_TEMP/chart/$v.yaml" \
              > "$RUNNER_TEMP/chart/$v.rules.yaml"
            test -s "$RUNNER_TEMP/chart/$v.rules.yaml"
          done
      - name: Kubernetes manifests (kubeconform)
        run: |
          # CRDs (ServiceMonitor, PrometheusRule, ExternalSecret…) validate against the datree catalog.
          docker run --rm -v "$RUNNER_TEMP/chart:/m:ro" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /m/values.yaml /m/values-prod.yaml
      - name: Kubernetes policies (Checkov on the rendered manifests; reviewed skips in .checkov.yaml)
        run: |
          cp .checkov.yaml "$RUNNER_TEMP/chart/"
          docker run --rm -v "$RUNNER_TEMP/chart:/m:ro" bridgecrew/checkov:3.4.5 \
            --config-file /m/.checkov.yaml -d /m --framework kubernetes --quiet --compact
      - name: Alert rules (promtool)
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/r:ro" -v "$RUNNER_TEMP/chart:/m:ro" \
            --entrypoint promtool prom/prometheus:v3.16.0 check rules \
            /r/zenith-alerts.yaml /m/values.rules.yaml /m/values-prod.rules.yaml

  security:
    name: secrets and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history: a secret removed later is still leaked
      - name: Secrets (gitleaks, whole history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo \
            --no-banner --redact --gitleaks-ignore-path /repo/.gitleaksignore
      - name: Static analysis (Semgrep OSS, p/default; WARNING and above fail)
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.186.0 semgrep scan --config p/default \
            --metrics=off --severity WARNING --severity ERROR --error \
            /src/zenith-backend/src /src/zenith-cli /src/sdk/Typescript/src
      # Free and open source, in place of what GitHub sells for private repositories (supply-chain.md).
      - name: Workflows (zizmor and actionlint)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src ghcr.io/zizmorcore/zizmor:1.32.0 \
            --offline --min-severity medium .github/workflows
          docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color=false
      - name: Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < zenith-backend/Dockerfile
      - name: Infrastructure as code (Trivy config; reviewed exceptions in .trivyignore.yaml)
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.76.2 config --quiet --severity HIGH,CRITICAL \
            --ignorefile /src/.trivyignore.yaml --exit-code 1 /src
      - name: Dockerfile and workflows (Checkov)
        run: |
          docker run --rm -v "$PWD:/src:ro" bridgecrew/checkov:3.4.5 --config-file /src/.checkov.yaml \
            -d /src --framework dockerfile github_actions --quiet --compact
      - name: npm dependencies (OSV-Scanner; per-directory osv-scanner.toml for reviewed exceptions)
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.7.1 scan source -r /src
