# Publishes one package from CI with no stored token: JSR and npm both trust this workflow through GitHub OIDC
# (JSR: the package is linked to this repository; npm: trusted publisher = this repository + release.yml), and npm
# adds a provenance attestation. Bump the version in the package's manifest, commit, then push its tag:
#   git tag zenith-client-v0.2.1 && git push origin zenith-client-v0.2.1
# Tags: zenith-v*, zenith-cli-v*, zenith-client-v*, create-zenith-v*. The job checks that the tag's version is the
# manifest's; a version already published is refused by the registry, so nothing can be overwritten.
name: release

on:
  push:
    tags: ["zenith-v*", "zenith-cli-v*", "zenith-client-v*", "create-zenith-v*"]

permissions:
  contents: read

env:
  DENO_VERSION: "2.9.8"
  NODE_VERSION: "24"

jobs:
  jsr:
    if: startsWith(github.ref_name, 'zenith-v') || startsWith(github.ref_name, 'zenith-cli-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # JSR verifies the run through GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Publish to JSR
        working-directory: ${{ startsWith(github.ref_name, 'zenith-cli-v') && 'zenith-cli' || 'zenith-backend' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version deno.json)"
          [ "${TAG##*-v}" = "$version" ] || { echo "::error::tag $TAG but deno.json says $version"; exit 1; }
          deno publish

  npm:
    if: startsWith(github.ref_name, 'zenith-client-v') || startsWith(github.ref_name, 'create-zenith-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # a release never restores a cache (cache poisoning)
      - name: Publish to npm (with provenance)
        working-directory: ${{ startsWith(github.ref_name, 'zenith-client-v') && 'sdk/Typescript' || 'create-zenith' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version package.json)"
          [ "${TAG##*-v}" = "$version" ] || { echo "::error::tag $TAG but package.json says $version"; exit 1; }
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; fi
          npm publish --provenance --access public
