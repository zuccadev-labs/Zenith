      - Webhooks y Cloud Code Hooks: architecture/webhooks-and-hooks.md
      - Cadena de suministro: architecture/supply-chain.md
      - Métricas y alertas: architecture/metrics.md
      - Registro de imágenes: architecture/registry.md
      - ADR-012 engine-auth: architecture-decisions/ADR-012-engine-auth.md
      - ADR-013 composición y acceso: architecture-decisions/ADR-013-composition-and-access.md
      - ADR-014 clases para usuarios: architecture-decisions/ADR-014-classes-for-users.md
      - ADR-015 política de API keys: architecture-decisions/ADR-015-api-key-access-policy.md
      - ADR-016 criptografía compartida y una sola API de keys: architecture-decisions/ADR-016-shared-crypto-and-single-api-keys.md
      - ADR-017 webhooks, hooks de Parse y bus de eventos: architecture-decisions/ADR-017-webhooks-hooks-event-bus.md
      - ADR-002 mTLS: architecture-decisions/ADR-002-mtls.md
