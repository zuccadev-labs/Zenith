<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zenith Universal Business API — API Reference</title>
  <meta name="description" content="Documentación de la API Zenith Universal Business API generada con Redoc.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Inter', sans-serif; }
    #redoc-container { min-height: 100vh; }
    .loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; flex-direction: column; gap: 16px;
      font-size: 18px; color: #6b7280;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="redoc-container">
    <div class="loading">
      <div class="spinner"></div>
      <span>Cargando API Reference…</span>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/redoc@2.1.3/bundles/redoc.standalone.js"></script>
  <script>
    Redoc.init('./openapi.json', {
      theme: {
        colors: { primary: { main: '#6366f1' } },
        typography: {
          fontFamily: "'Inter', sans-serif",
          headings: { fontFamily: "'Inter', sans-serif", fontWeight: '700' },
        },
        sidebar: { backgroundColor: '#0f172a', textColor: '#94a3b8' },
        rightPanel: { backgroundColor: '#1e293b' },
      },
      hideDownloadButton: false,
      expandDefaultServerVariables: true,
      pathInMiddlePanel: false,
      sortEnumValuesAlphabetically: true,
      sortOperationsAlphabetically: true,
    }, document.getElementById('redoc-container'));
  </script>
</body>
</html>
